      - mobile/navigation.md
      - mobile/notes.md
      - mobile/search-filters.md
      - mobile/ai-answers.md
      - mobile/capture.md
      - mobile/collect.md
      - mobile/player.md
      - mobile/gallery.md
      - mobile/prayer.md
      - mobile/alarms.md
      - mobile/widgets.md
      - mobile/calendar.md
      - mobile/sync.md
      - mobile/server-pages.md
