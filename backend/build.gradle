plugins {
    id 'java'
    id 'war'
    id 'org.springframework.boot' version '4.1.0'
    id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.nibras'
version = '1.3.1'

// io.spring.dependency-management's default Maven-exclusion-honoring pass misfires against Boot
// 4.1's BOM: it globally excludes org.springframework:spring-web (and com.google.protobuf:
// protobuf-java) from every configuration, even direct dependencies, breaking the war plugin's
// merged runtime classpath (spring-webmvc needs spring-web at runtime). Known plugin regression
// class — see https://github.com/spring-gradle-plugins/dependency-management-plugin/issues/368.
dependencyManagement {
    applyMavenExclusions = false
}

// Auto-incrementing build number, persisted in build-number.properties (gitignored). Bumps on every
// Gradle configuration (i.e. every build) — same convention as the frontend's build-number.json and
// mobile's version.properties/BuildConfig.BUILD_NUMBER. Surfaced via BuildProperties as
// `buildNumber`, alongside `codename`.
def buildNumberFile = file('build-number.properties')
def buildNumberProps = new Properties()
if (buildNumberFile.exists()) {
    buildNumberFile.withInputStream { buildNumberProps.load(it) }
}
def buildNumber = (buildNumberProps.getProperty('buildNumber', '0') as Integer) + 1
buildNumberProps.setProperty('buildNumber', buildNumber as String)
buildNumberFile.withOutputStream { buildNumberProps.store(it, 'Auto-incremented build number') }

// Generate META-INF/build-info.properties so BuildProperties exposes the version/build time
// to InfoController (single source of truth = the gradle `version` above). `codename` is this
// release's Mint-style nickname, surfaced alongside the version in the UI.
springBoot {
    buildInfo {
        properties {
            additional = [codename: 'Serenity', buildNumber: "$buildNumber"]
        }
    }
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(21)
    }
}

repositories {
    mavenCentral()
}

dependencies {
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-security'

    // JWT (JJWT) for stateless auth shared by the SPA and the mobile app.
    implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

    // Jackson 3 is Boot 4's default; this app still uses Jackson 2 directly in a couple of places
    // (SecurityConfig, InfoController) and the whole spring.jackson.* date/time serialization
    // config was tuned for Jackson 2 behavior. Opt into the compatibility module so this upgrade
    // is scoped to "make the framework/Security/Hibernate baseline work," not also a JSON-library
    // migration in the same step — that's deferred to its own later, deliberate piece of work.
    implementation 'org.springframework.boot:spring-boot-jackson2'

    implementation 'com.rometools:rome:2.1.0'

    // HTML parsing for URL -> resource scraping (UrlScrapeService). Also gives us a whitelist-based
    // sanitiser, which matters because the text we keep comes from an arbitrary remote page.
    implementation 'org.jsoup:jsoup:1.18.1'
    implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:3.0.3'

    // Server-side Markdown -> HTML for the static-site generator (GFM tables/strikethrough/autolinks).
    implementation 'org.commonmark:commonmark:0.22.0'
    implementation 'org.commonmark:commonmark-ext-gfm-tables:0.22.0'
    implementation 'org.commonmark:commonmark-ext-gfm-strikethrough:0.22.0'
    implementation 'org.commonmark:commonmark-ext-autolink:0.22.0'
    // File search (Search page → Files): an embedded Lucene index over the repo folders and the
    // notes' companion folders, with Tika turning PDF / Office / OpenDocument / HTML into text.
    // Only the parser modules for the whitelisted formats, not Tika's whole standard package.
    implementation 'org.apache.lucene:lucene-core:10.5.1'
    implementation 'org.apache.lucene:lucene-analysis-common:10.5.1'
    implementation 'org.apache.lucene:lucene-queryparser:10.5.1'
    implementation 'org.apache.lucene:lucene-highlighter:10.5.1'
    implementation 'org.apache.tika:tika-core:3.3.3'
    implementation 'org.apache.tika:tika-parser-pdf-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-microsoft-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-miscoffice-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-html-module:3.3.3'
    implementation 'org.apache.tika:tika-parser-text-module:3.3.3'
    runtimeOnly 'com.mysql:mysql-connector-j'

    // Schema migrations applied at startup (see db/migration). Replaces hand-running
    // db/extra-schema.sql on every machine; ddl-auto stays 'none' so Hibernate never guesses.
    // spring-boot-flyway is required as well: Boot 4 moved each integration's auto-configuration
    // out of spring-boot-autoconfigure into its own module, so flyway-core alone sits on the
    // classpath and is never wired up — the app starts clean and silently skips every migration.
    implementation 'org.springframework.boot:spring-boot-flyway'
    implementation 'org.flywaydb:flyway-core'
    implementation 'org.flywaydb:flyway-mysql'

    // Hot-reload: restarts the app when classes on the classpath change (excluded from the WAR).
    developmentOnly 'org.springframework.boot:spring-boot-devtools'

    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // Container-supplied at deploy time. Do NOT use spring-boot-starter-tomcat here: on Boot 4 it
    // transitively pulls spring-boot/spring-core/spring-web, and the war plugin subtracts all of
    // providedRuntime from WEB-INF/lib — the deployed WAR then has no Spring at all, no
    // ServletContainerInitializer is found, and every context silently 404s. These four still land
    // in WEB-INF/lib-provided, which WarLauncher reads, so `java -jar app.war` keeps working.
    providedRuntime 'org.apache.tomcat.embed:tomcat-embed-core'
    providedRuntime 'org.apache.tomcat.embed:tomcat-embed-el'
    providedRuntime 'org.apache.tomcat.embed:tomcat-embed-websocket'
    providedRuntime 'jakarta.annotation:jakarta.annotation-api'

    testImplementation 'org.springframework.boot:spring-boot-starter-test'
    // Boot 4's modularization split MockMvc test support (@AutoConfigureMockMvc) out of
    // spring-boot-starter-test into its own artifact.
    testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
}

tasks.named('test') {
    useJUnitPlatform()
}

// ---- Bundle the React frontend into the WAR (served as static resources) ----------------

def frontendDir = file("$rootDir/../frontend")
def isWindows = System.getProperty('os.name').toLowerCase().contains('win')
def npm = isWindows ? 'npm.cmd' : 'npm'
def generatedFrontend = layout.buildDirectory.dir('generated-frontend')

tasks.register('frontendInstall', Exec) {
    workingDir frontendDir
    inputs.file("$frontendDir/package.json")
    inputs.file("$frontendDir/package-lock.json")
    outputs.dir("$frontendDir/node_modules")
    commandLine npm, 'ci'
}

tasks.register('frontendBuild', Exec) {
    dependsOn 'frontendInstall'
    workingDir frontendDir
    inputs.dir("$frontendDir/src")
    inputs.file("$frontendDir/index.html")
    inputs.file("$frontendDir/package.json")
    inputs.file("$frontendDir/package-lock.json")
    inputs.file("$frontendDir/vite.config.ts")
    inputs.files(fileTree(frontendDir) { include 'tsconfig*.json' })
    outputs.dir("$frontendDir/dist")
    commandLine npm, 'run', 'build'
}

// Place the SPA under static/ so Spring serves it from the classpath root. Sync (not Copy) so stale
// hashed bundles from previous builds are pruned — the WAR ships exactly the current UI.
tasks.register('copyFrontend', Sync) {
    dependsOn 'frontendBuild'
    from "$frontendDir/dist"
    into generatedFrontend.map { it.dir('static') }
}

// Expose the generated SPA as a resource directory; processResources packages it into the WAR.
sourceSets.main.resources.srcDir(generatedFrontend)
tasks.named('processResources') { dependsOn 'copyFrontend' }

// Guard against the silent-404 packaging regression: Gradle's war plugin writes
// runtimeClasspath-minus-providedRuntime into WEB-INF/lib and the remainder into
// WEB-INF/lib-provided. Tomcat only reads WEB-INF/lib, so if spring-web lands in lib-provided the
// deployed WAR has no ServletContainerInitializer, Spring never boots, and every URL 404s with a
// clean log (java -jar still works, which is what makes it so easy to miss). See war-fix.md.
tasks.named('bootWar') {
    doLast {
        def war = archiveFile.get().asFile
        def names = new java.util.zip.ZipFile(war).withCloseable { zip ->
            zip.entries().collect { it.name }
        }
        if (!names.any { it ==~ /WEB-INF\/lib\/spring-web-[0-9].*\.jar/ }) {
            throw new GradleException(
                    "WAR has spring-web outside WEB-INF/lib — a Tomcat deploy would silently 404. " +
                    "Check the providedRuntime declarations in build.gradle (see war-fix.md).")
        }
    }
}
